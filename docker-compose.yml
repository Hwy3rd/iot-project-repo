# Dev stack — standalone. Datastores are published on localhost with default
# credentials (matching server/.env.example), so `docker compose up -d redis
# mysql mongo minio mosquitto` works without a root .env for host-run dev
# (pnpm start:dev). Production uses docker-compose.production.yml instead;
# keep the shared parts (builds, healthchecks, depends_on, volumes) in sync
# with it by hand.
services:
  app:
    build:
      context: ./server
      additional_contexts:
        docs: ./docs
    container_name: node_server
    ports:
      - "8080:3000"
    # Optional so datastore-only dev works without a root .env.
    env_file:
      - path: ./.env
        required: false
    environment:
      - NODE_ENV=production
    command: sh -c "node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js && node dist/main.js"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./server
      additional_contexts:
        docs: ./docs
    container_name: service_worker
    command: node dist/workers/main.js
    env_file:
      - path: ./.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_db
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iot_database}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Reads the container's own env at check time ($$ = no compose
      # substitution), so it always matches the environment block above.
      test:
        [
          "CMD-SHELL",
          'mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: iot
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # MinIO no longer publishes free images (quay.io/minio/minio and Docker
    # Hub minio/minio now return 401), so this is Chainguard's free build of
    # the same server. Its free tier only offers `latest`. It runs as uid
    # 65532, not root: a minio_data volume created by the old root image
    # needs a one-off chown (docs/INFRASTRUCTURE.md §7).
    image: cgr.dev/chainguard/minio:latest
    container_name: minio_bucket
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -i healthcheck -W 3",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  redisdata:
  mysql_data:
  mongo_data:
  minio_data:
  mosquitto_data:
