version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ENV_VAR=production
      - MONGO_URI=mongodb://root:password@mongo:27017/iot?authSource=admin
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=mydatabase
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-dev-secret}
      - JWT_EXPIRES_IN=15m
      - COOKIE_NAME=access_token
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-dev-refresh-secret}
      - JWT_REFRESH_EXPIRES_IN=7d
      - REFRESH_COOKIE_NAME=refresh_token
      - NODE_ENV=production
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - mysql
      - mongo
    restart: unless-stopped

  worker:
    build: .
    command: node dist/main.js
    environment:
      - ENV_VAR=production
      - MONGO_URI=mongodb://root:password@mongo:27017/iot?authSource=admin
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=mydatabase
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-dev-secret}
      - JWT_EXPIRES_IN=15m
      - COOKIE_NAME=access_token
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-dev-refresh-secret}
      - JWT_REFRESH_EXPIRES_IN=7d
      - REFRESH_COOKIE_NAME=refresh_token
      - NODE_ENV=production
    volumes:
      - .:/app
    depends_on:
      - redis
      - mysql
      - mongo
    restart: unless-stopped

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_local
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql_local
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: mydatabase
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo_local
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: iot
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  db_data:
  redisdata:
  mysql_data:
  mongo_data:
