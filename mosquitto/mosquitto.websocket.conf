# Tunnel mode: both listeners are private to the Docker network.
# Public clients use WSS:443 at Cloudflare; cloudflared upgrades HTTP to WS
# on port 8083. Backend/worker use native MQTT on port 1883.
allow_anonymous false
password_file /mosquitto/auth-tunnel/passwd
acl_file /mosquitto/auth-tunnel/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
protocol mqtt

listener 8083
protocol websockets
