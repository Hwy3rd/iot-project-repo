# Tunnel mode: both listeners are private to the Docker network.
# Public clients use WSS:443 at Cloudflare; cloudflared upgrades HTTP to WS
# on port 8083. Backend/worker use native MQTT on port 1883.
allow_anonymous false
password_file /mosquitto/auth-tunnel/passwd
acl_file /mosquitto/auth-tunnel/acl

# Per-device accounts made from the web UI at runtime (backend publishes to
# $CONTROL/dynamic-security/v1, MQTT_DEVICE_ACCOUNTS=dynsec). Checked
# alongside the password file above: an account defined in both is decided
# by this plugin, so the backend never reuses the env accounts' names. The
# file lives in the data volume so the accounts survive restarts.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
protocol mqtt

listener 8083
protocol websockets
