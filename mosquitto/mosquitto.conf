# Broker config for device telemetry. Every client must log in: the password
# file and ACL are generated from env at container start by
# mosquitto/entrypoint.sh (see there for the accounts and what each may
# access). There is still no TLS listener — credentials cross the network in
# plain text, acceptable on the trusted LAN the ESP32s share with the host,
# not on a public/untrusted one (that needs a TLS listener on 8883).

listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Per-device accounts made from the web UI at runtime (backend publishes to
# $CONTROL/dynamic-security/v1, MQTT_DEVICE_ACCOUNTS=dynsec). Checked
# alongside the password file above: an account defined in both is decided
# by this plugin, so the backend never reuses the env accounts' names. The
# file lives in the data volume so the accounts survive restarts.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout
