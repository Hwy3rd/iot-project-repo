# Minimal broker config to get device telemetry flowing end-to-end.
# Anonymous connections are allowed and there is no TLS listener — acceptable
# for a broker reachable only inside the docker-compose network, not for one
# exposed to a public/untrusted network. Locking this down (password_file,
# TLS listener on 8883) is a follow-up decision, not part of this base setup —
# see server/.env.production.example's MQTT section.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
