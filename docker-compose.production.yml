# Production stack — standalone (not layered on docker-compose.yml), used by
# init.sh/run.sh. Differs from the dev file in:
#   - the root .env is required and datastore credentials must be set in it
#     (no dev defaults);
#   - only MQTT (1883, for devices) is published on all interfaces; the API,
#     MinIO and datastores are published on 127.0.0.1 only (same ports as
#     dev) for local admin tools, and reached publicly through the Cloudflare
#     Tunnel (API, MinIO) or not at all (datastores);
#   - the cloudflared service.
# Keep the shared parts (builds, healthchecks, depends_on, volumes) in sync
# with docker-compose.yml by hand.
services:
  app:
    build:
      context: ./server
      additional_contexts:
        docs: ./docs
    container_name: node_server
    ports:
      - "8080:3000"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-service:8000
    command: sh -c "node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js && node dist/main.js"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./server
      additional_contexts:
        docs: ./docs
    container_name: service_worker
    command: node dist/workers/main.js
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_db
    # REDISCLI_AUTH is what redis-cli reads, so the healthcheck and
    # `docker exec redis_db redis-cli ...` authenticate without -a.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Reads the container's own env at check time ($$ = no compose
      # substitution), so it always matches the environment block above.
      test:
        [
          "CMD-SHELL",
          'mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: iot
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # MinIO no longer publishes free images (quay.io/minio/minio and Docker
    # Hub minio/minio now return 401), so this is Chainguard's free build of
    # the same server. Its free tier only offers `latest`. It runs as uid
    # 65532, not root: a minio_data volume created by the old root image
    # needs a one-off chown (docs/INFRASTRUCTURE.md §7).
    image: cgr.dev/chainguard/minio:latest
    container_name: minio_bucket
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto_broker
    # Generates the password file + ACL from the env below, then starts the
    # broker as the image normally would (see mosquitto/entrypoint.sh).
    entrypoint: ["/bin/sh", "/mosquitto-entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    ports:
      - "1883:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      MQTT_DEVICE_USERNAME: ${MQTT_DEVICE_USERNAME:?set MQTT_DEVICE_USERNAME in .env}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:?set MQTT_DEVICE_PASSWORD in .env}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/mosquitto-entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 1883 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/#' -C 1 -i healthcheck -W 3",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Temperature forecast (see ai-service/). Optional for the app: when it is
  # down, ingest and the charts work as usual, only forecasts are missing —
  # hence no depends_on from app. Healthcheck lives in its Dockerfile.
  ai-service:
    build:
      context: ./ai-service
    container_name: ai_service
    ports:
      - "127.0.0.1:8000:8000"
    # pandas + scikit-learn; caps it so it can't starve the datastores.
    mem_limit: 512m
    restart: unless-stopped

  # Cloudflare Tunnel: outbound-only connection to Cloudflare's edge, which
  # routes public hostnames back to services on this compose network by name
  # (e.g. api.<domain> -> http://app:3000, files.<domain> -> http://minio:9000).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redisdata:
  mysql_data:
  mongo_data:
  minio_data:
  mosquitto_data:
